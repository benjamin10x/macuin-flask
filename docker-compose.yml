services:

  # ─── FastAPI (backend) ────────────────────────────────────────────────────
  api:
    build:
      context: ./api
    container_name: macuin_flask_api
    restart: unless-stopped
    volumes:
      - api_data:/data
    environment:
      DATABASE_URL: sqlite:////data/macuin.db
      SECRET_KEY: macuin-super-secret-2024
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Flask (panel admin) ──────────────────────────────────────────────────
  web:
    build: .
    container_name: macuin_flask_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: flask-secret-2024
      API_BASE_URL: http://api:8001/api/v1
      API_TIMEOUT: "10"
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "run:app"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_data:
